name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_coordinates tests.test_frame
      - run: python scripts/build_plugin_zip.py

  qgis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis: ["3.40", "4.2"]
    steps:
      - uses: actions/checkout@v4
      - name: Start QGIS test container
        run: |
          docker run -d --name qgis-test \
            -e DISPLAY=:99 \
            -v "${GITHUB_WORKSPACE}:/tests_directory" \
            qgis/qgis:${{ matrix.qgis }} \
            tail -f /dev/null
          for attempt in $(seq 1 30); do
            if docker inspect -f '{{.State.Running}}' qgis-test | grep -q true; then break; fi
            sleep 1
          done
      - name: Run QGIS integration tests
        run: |
          docker exec qgis-test sh -c "Xvfb :99 -screen 0 1024x768x24 -ac >/tmp/xvfb.log 2>&1 &"
          docker exec qgis-test sh -c "cd /tests_directory && python3 -m unittest tests.test_qgis"
