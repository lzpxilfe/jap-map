name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy Pillow scipy scikit-image
      - run: >-
          python -m unittest -v
          tests.test_coordinates tests.test_frame tests.test_histcontour_core
          tests.test_ink tests.test_ink_candidate_script tests.test_contour_completion
          tests.test_contour_completion_script tests.test_segment_review
          tests.test_ink_segment_review_script tests.test_ink_guidance
          tests.test_synthetic_ink tests.test_score_ink_segments
          tests.test_margin_ocr tests.test_margin_ocr_sources
          tests.test_skeleton_graph tests.test_contour_vector_comparison
          tests.test_contour_context
          tests.test_contour_chains
          tests.test_human_feedback
          tests.test_assisted_drawing
          tests.test_assisted_review_sheets
          tests.test_assisted_review_sketch
          tests.test_assisted_curve_refinement
          tests.test_assisted_review
          tests.test_assisted_screening_io
          tests.test_gap_refinement
          tests.test_feedback_refinement_script
          tests.test_contour_network
          tests.test_map_text_detection
          tests.test_map_text_multiscale
          tests.test_text_ownership
          tests.test_observed_linework
          tests.test_observed_curve
          tests.test_directional_trace
          tests.test_reconstruction_review
          tests.test_observed_reconstruction_script
          tests.test_observed_line_review
          tests.test_component_text_candidates
          tests.test_component_text_recognition
          tests.test_numeric_ink_ownership
          tests.test_numeric_line_partition
          tests.test_numeric_separation_script
          tests.test_regional_gap_matching
          tests.test_gap_endpoint_context
          tests.test_short_ink_recovery
          tests.test_recovery_edge_partition
          tests.test_recovery_export
          tests.test_feedback_lineage
          tests.test_postassembly_locks
          tests.test_semantic_reference_overlap
          tests.test_reconstruction_pipeline
          tests.test_fragment_chain_recovery
          tests.test_contextual_gap_ranking
          tests.test_context_gap_preview
          tests.test_numeric_gap_context_script
      - run: python scripts/build_plugin_zip.py

  qgis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis: ["3.40", "4.2"]
    steps:
      - uses: actions/checkout@v4
      - name: Start QGIS test container
        run: |
          docker run -d --name qgis-test \
            -e DISPLAY=:99 \
            -v "${GITHUB_WORKSPACE}:/tests_directory" \
            qgis/qgis:${{ matrix.qgis }} \
            tail -f /dev/null
          for attempt in $(seq 1 30); do
            if docker inspect -f '{{.State.Running}}' qgis-test | grep -q true; then break; fi
            sleep 1
          done
      - name: Run QGIS integration tests
        run: |
          docker exec qgis-test sh -c "Xvfb :99 -screen 0 1024x768x24 -ac >/tmp/xvfb.log 2>&1 &"
          docker exec qgis-test sh -c "cd /tests_directory && python3 -m unittest tests.test_qgis"
